services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./src:/var/www/html

  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: laravel13
      MARIADB_USER: laravel13
      MARIADB_PASSWORD: laravel13
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data: